services:
  postgres:
    image: postgres:16
    container_name: urlshortener-postgres
    environment:
      POSTGRES_DB: urlshortener_db
      POSTGRES_USER: jesson
      POSTGRES_PASSWORD: whatsoever
    ports:
      - "5432:5432"
    volumes:
      - urlshortener_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    ports:
      - "6379:6379"

volumes:
  urlshortener_pgdata:
spring.application.name=create-url-service
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener_db}
spring.datasource.username=${DB_OWNER_USERNAME:create_url_owner}
spring.datasource.password=${DB_OWNER_PASSWORD:ownerpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1



spring.application.name=redirect-service
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener_db}
spring.datasource.username=${DB_READER_USERNAME:redirect_reader}
spring.datasource.password=${DB_READER_PASSWORD:readerpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_URL:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

